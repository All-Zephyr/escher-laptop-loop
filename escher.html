<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Escherify v2 (Log Mapping)</title>
  <style>
    :root { --bg:#0f1320; --panel:#161d2e; --border:#2d3750; --text:#edf2ff; --muted:#a8b4cc; --accent:#ff4d4d; }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
    .top{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#12192a;border-bottom:1px solid var(--border)}
    .meta{font-size:12px;color:var(--muted);text-align:right;line-height:1.35}
    .app{max-width:1320px;margin:0 auto;padding:14px;display:grid;grid-template-columns:350px 1fr;gap:12px}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px}
    .control{margin-bottom:10px}
    .control label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
    input,button{width:100%}
    input[type="range"]{accent-color:var(--accent)}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    button{background:#202a40;border:1px solid #405076;color:var(--text);padding:9px;border-radius:8px;font-weight:700;cursor:pointer}
    canvas{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:10px;background:#0a0f18}
    .status{font-size:14px;color:var(--muted);min-height:20px;margin-bottom:8px}
    .hint{font-size:13px;color:var(--muted);line-height:1.35}
    @media (max-width:1000px){.app{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top">
    <strong>Escherify v2 — logarithm mapping</strong>
    <div class="meta" id="meta">Version v2<br/>Last edit --</div>
  </header>

  <main class="app">
    <section class="panel">
      <p class="hint">Math model (same structure as the classic construction):<br>
      <code>z = z0 + R(θ) · zoom · exp( log((w-z0)·R(-θ)) / α )</code><br>
      where <code>α = 1 - i·log(q)/(2π)</code>.</p>

      <div class="control">
        <label for="file">Image</label>
        <input id="file" type="file" accept="image/*" />
      </div>

      <div class="control row">
        <div>
          <label for="centerX"><span>Center X</span><strong id="centerXVal">600</strong></label>
          <input id="centerX" type="range" min="1" max="1200" value="600" />
        </div>
        <div>
          <label for="centerY"><span>Center Y</span><strong id="centerYVal">600</strong></label>
          <input id="centerY" type="range" min="1" max="1200" value="600" />
        </div>
      </div>

      <div class="control">
        <label for="zoom"><span>Zoom</span><strong id="zoomVal">0.800</strong></label>
        <input id="zoom" type="range" min="0.70" max="1.10" step="0.001" value="0.8" />
      </div>

      <div class="control">
        <label for="branch"><span>Branch direction (°)</span><strong id="branchVal">160.0</strong></label>
        <input id="branch" type="range" min="0" max="360" step="0.1" value="160" />
      </div>

      <div class="control">
        <label for="q"><span>q parameter</span><strong id="qVal">22.584</strong></label>
        <input id="q" type="range" min="1.2" max="40" step="0.001" value="22.5836845286" />
      </div>

      <div class="control">
        <label for="quality"><span>Preview quality</span><strong id="qualityVal">0.70</strong></label>
        <input id="quality" type="range" min="0.25" max="1" step="0.05" value="0.7" />
      </div>

      <div class="row">
        <button id="reset">Reset</button>
        <button id="download">Download PNG</button>
      </div>

      <p class="hint">Click preview to set center quickly.</p>
    </section>

    <section class="panel">
      <div class="status" id="status">No image loaded yet.</div>
      <canvas id="canvas" width="900" height="900"></canvas>
    </section>
  </main>

  <script>
    const el = {
      file: document.getElementById('file'),
      centerX: document.getElementById('centerX'),
      centerY: document.getElementById('centerY'),
      zoom: document.getElementById('zoom'),
      branch: document.getElementById('branch'),
      q: document.getElementById('q'),
      quality: document.getElementById('quality'),
      centerXVal: document.getElementById('centerXVal'),
      centerYVal: document.getElementById('centerYVal'),
      zoomVal: document.getElementById('zoomVal'),
      branchVal: document.getElementById('branchVal'),
      qVal: document.getElementById('qVal'),
      qualityVal: document.getElementById('qualityVal'),
      reset: document.getElementById('reset'),
      download: document.getElementById('download'),
      status: document.getElementById('status'),
      canvas: document.getElementById('canvas'),
      meta: document.getElementById('meta')
    };

    const defaults = { centerX: 600, centerY: 600, zoom: 0.8, branch: 160, q: 22.5836845286, quality: 0.7 };

    const srcCanvas = document.createElement('canvas');
    const srcCtx = srcCanvas.getContext('2d', { willReadFrequently: true });
    const ctx = el.canvas.getContext('2d', { willReadFrequently: true });
    let loaded = false;
    let renderToken = 0;

    const C = {
      add: (a,b) => ({re:a.re+b.re, im:a.im+b.im}),
      sub: (a,b) => ({re:a.re-b.re, im:a.im-b.im}),
      mul: (a,b) => ({re:a.re*b.re-a.im*b.im, im:a.re*b.im+a.im*b.re}),
      div: (a,b) => { const d=b.re*b.re+b.im*b.im; return {re:(a.re*b.re+a.im*b.im)/d, im:(a.im*b.re-a.re*b.im)/d}; },
      abs: (a) => Math.hypot(a.re, a.im),
      log: (a) => ({re:Math.log(Math.hypot(a.re,a.im)), im:Math.atan2(a.im,a.re)}),
      exp: (a) => { const e=Math.exp(a.re); return {re:e*Math.cos(a.im), im:e*Math.sin(a.im)}; }
    };

    function setLabels() {
      el.centerXVal.textContent = Math.round(el.centerX.value);
      el.centerYVal.textContent = Math.round(el.centerY.value);
      el.zoomVal.textContent = Number(el.zoom.value).toFixed(3);
      el.branchVal.textContent = Number(el.branch.value).toFixed(1);
      el.qVal.textContent = Number(el.q.value).toFixed(3);
      el.qualityVal.textContent = Number(el.quality.value).toFixed(2);
    }

    function toComplex(px, py, n) {
      return { re: -1 + 2 * (px - 1) / (n - 1), im: 1 - 2 * (py - 1) / (n - 1) };
    }

    function toPixel(z, n) {
      return { x: 1 + (z.re + 1) * (n - 1) / 2, y: 1 + (1 - z.im) * (n - 1) / 2 };
    }

    function sampleBilinear(src, w, h, x, y) {
      if (x < 1 || x > w || y < 1 || y > h) return [255,255,255,255];
      const fx = x - 1, fy = y - 1;
      const x0 = Math.floor(fx), y0 = Math.floor(fy);
      const x1 = Math.min(x0 + 1, w - 1), y1 = Math.min(y0 + 1, h - 1);
      const dx = fx - x0, dy = fy - y0;
      const i00 = (y0*w + x0)*4, i10 = (y0*w + x1)*4, i01 = (y1*w + x0)*4, i11 = (y1*w + x1)*4;
      const out = [0,0,0,255];
      for (let k = 0; k < 3; k++) {
        const a = src[i00+k]*(1-dx) + src[i10+k]*dx;
        const b = src[i01+k]*(1-dx) + src[i11+k]*dx;
        out[k] = a*(1-dy) + b*dy;
      }
      return out;
    }

    function srcMap(px, py, n, z0, zoom, theta, alpha) {
      // Exactly: z = z0 + R(theta) * zoom * exp( log( (w-z0) * R(-theta) ) / alpha )
      const w = toComplex(px, py, n);
      const u = C.sub(w, z0);
      const eps = 1e-12;
      if (C.abs(u) < eps) return { x: Number(el.centerX.value), y: Number(el.centerY.value) };

      const rotNeg = { re: Math.cos(-theta), im: Math.sin(-theta) };
      const rotPos = { re: Math.cos(theta), im: Math.sin(theta) };
      const u2 = C.mul(u, rotNeg);
      const mapped = C.exp(C.div(C.log(u2), alpha));
      const z = C.add(z0, C.mul({ re: zoom, im: 0 }, C.mul(rotPos, mapped)));
      return toPixel(z, n);
    }

    function requestRender() {
      if (!loaded) return;
      const token = ++renderToken;
      requestAnimationFrame(() => { if (token === renderToken) render(false); });
    }

    function render(forceFull) {
      if (!loaded) return;
      const n = srcCanvas.width;
      const quality = forceFull ? 1 : Number(el.quality.value);
      const outN = Math.max(220, Math.floor(n * quality));
      el.canvas.width = outN;
      el.canvas.height = outN;

      const src = srcCtx.getImageData(0, 0, n, n).data;
      const out = ctx.createImageData(outN, outN);
      const dst = out.data;

      const z0 = toComplex(Number(el.centerX.value), Number(el.centerY.value), n);
      const zoom = Number(el.zoom.value);
      const theta = Number(el.branch.value) * Math.PI / 180;
      const q = Number(el.q.value);
      const alpha = { re: 1, im: -Math.log(q) / (2 * Math.PI) };

      const t0 = performance.now();
      for (let oy = 0; oy < outN; oy++) {
        const py = 1 + oy * (n - 1) / Math.max(1, outN - 1);
        for (let ox = 0; ox < outN; ox++) {
          const px = 1 + ox * (n - 1) / Math.max(1, outN - 1);
          const p = srcMap(px, py, n, z0, zoom, theta, alpha);
          const rgba = sampleBilinear(src, n, n, p.x, p.y);
          const di = (oy * outN + ox) * 4;
          dst[di] = rgba[0]; dst[di+1] = rgba[1]; dst[di+2] = rgba[2]; dst[di+3] = 255;
        }
      }

      ctx.putImageData(out, 0, 0);
      el.status.textContent = `Rendered ${outN}×${outN} in ~${Math.round(performance.now()-t0)}ms`;
    }

    function loadImage(file) {
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        const n = Math.min(img.width, img.height, 1600);
        srcCanvas.width = n;
        srcCanvas.height = n;
        srcCtx.clearRect(0, 0, n, n);
        srcCtx.drawImage(img, 0, 0, n, n);
        el.centerX.max = n;
        el.centerY.max = n;
        el.centerX.value = Math.min(defaults.centerX, n);
        el.centerY.value = Math.min(defaults.centerY, n);
        loaded = true;
        setLabels();
        requestRender();
      };
      img.src = URL.createObjectURL(file);
    }

    el.file.addEventListener('change', (e) => loadImage(e.target.files && e.target.files[0]));
    [el.centerX, el.centerY, el.zoom, el.branch, el.q, el.quality].forEach(node => {
      node.addEventListener('input', () => { setLabels(); requestRender(); });
    });

    el.canvas.addEventListener('click', (e) => {
      if (!loaded) return;
      const rect = el.canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      const n = srcCanvas.width;
      el.centerX.value = Math.max(1, Math.min(n, Math.round(1 + x * (n - 1))));
      el.centerY.value = Math.max(1, Math.min(n, Math.round(1 + y * (n - 1))));
      setLabels();
      requestRender();
    });

    el.reset.addEventListener('click', () => {
      el.zoom.value = defaults.zoom;
      el.branch.value = defaults.branch;
      el.q.value = defaults.q;
      el.quality.value = defaults.quality;
      if (loaded) {
        const n = srcCanvas.width;
        el.centerX.value = Math.min(defaults.centerX, n);
        el.centerY.value = Math.min(defaults.centerY, n);
      }
      setLabels();
      requestRender();
    });

    el.download.addEventListener('click', () => {
      if (!loaded) return;
      render(true);
      const a = document.createElement('a');
      a.href = el.canvas.toDataURL('image/png');
      a.download = 'escherify-v2.png';
      a.click();
      requestRender();
    });

    // Visible fallback so page is never blank
    ctx.fillStyle = '#10182a';
    ctx.fillRect(0, 0, el.canvas.width, el.canvas.height);
    ctx.fillStyle = '#e7edff';
    ctx.font = 'bold 30px Arial';
    ctx.fillText('Escherify v2', 28, 60);
    ctx.font = '16px Arial';
    ctx.fillStyle = '#a8b4cc';
    ctx.fillText('Upload an image to begin.', 28, 90);

    const d = new Date(document.lastModified);
    el.meta.innerHTML = `Version v2<br/>Last edit ${Number.isNaN(d.getTime()) ? 'Unknown' : d.toLocaleString()}`;
    setLabels();
  </script>
</body>
</html>
