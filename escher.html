<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Escher Loop Studio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090a0d;
      --panel: #13151b;
      --text: #eceef6;
      --muted: #9ca3b6;
      --accent: #ff2a2a;
      --border: #2b303a;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #171b24, var(--bg) 45%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap {
      max-width: 1280px;
      margin: 0 auto;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      padding: 18px;
    }
    .panel {
      border: 1px solid var(--border);
      background: color-mix(in oklab, var(--panel), #000 8%);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: 0 8px 28px rgba(0,0,0,.32);
    }
    h1 { margin: 0 0 8px; font-size: 1.2rem; }
    .small { color: var(--muted); margin: 0 0 14px; font-size: .92rem; line-height: 1.4; }
    .control { margin-bottom: 12px; }
    .control label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: .9rem;
    }
    input, select, button { width: 100%; }
    input[type="range"] { accent-color: var(--accent); }
    button {
      border: 1px solid #404858;
      background: #1e2430;
      color: var(--text);
      border-radius: 10px;
      padding: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { border-color: #677389; }
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .viewer { display: grid; grid-template-rows: auto auto 1fr; gap: 10px; }
    .status { color: var(--muted); font-size: .9rem; }
    .hint { color: var(--muted); font-size: .85rem; }
    canvas {
      width: 100%;
      height: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: #000;
      image-rendering: pixelated;
    }
    @media (max-width: 1000px) {
      .wrap { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <h1>Escher Loop Studio</h1>
      <p class="small">Built for your two-image workflow: load the white and black versions, process both, then preview as a looping flip animation.</p>

      <div class="control">
        <label for="fileA"><span>Image A (light)</span></label>
        <input id="fileA" type="file" accept="image/*" />
      </div>

      <div class="control">
        <label for="fileB"><span>Image B (dark)</span></label>
        <input id="fileB" type="file" accept="image/*" />
      </div>

      <div class="control">
        <label for="viewMode"><span>View</span></label>
        <select id="viewMode">
          <option value="loop" selected>Loop A ↔ B</option>
          <option value="A">Image A only</option>
          <option value="B">Image B only</option>
          <option value="split">Split screen A|B</option>
        </select>
      </div>

      <div class="control">
        <label for="renderMode"><span>Render style</span></label>
        <select id="renderMode">
          <option value="source">Original</option>
          <option value="redOnBlack" selected>Red lines on black</option>
          <option value="redOnWhite">Red lines on white</option>
        </select>
      </div>

      <div class="control">
        <label for="edge"><span>Edge threshold</span><strong id="edgeVal">40</strong></label>
        <input id="edge" type="range" min="5" max="200" value="40" />
      </div>

      <div class="control">
        <label for="boost"><span>Line intensity</span><strong id="boostVal">2.3</strong></label>
        <input id="boost" type="range" min="1" max="5" step="0.1" value="2.3" />
      </div>

      <div class="control">
        <label for="blur"><span>Smoothing</span><strong id="blurVal">1.0</strong></label>
        <input id="blur" type="range" min="0" max="3" step="0.1" value="1" />
      </div>

      <div class="control">
        <label for="fps"><span>Loop speed (FPS)</span><strong id="fpsVal">2</strong></label>
        <input id="fps" type="range" min="1" max="12" value="2" />
      </div>

      <div class="btn-row">
        <button id="toggle">Pause loop</button>
        <button id="download">Download PNG</button>
      </div>
      <div class="btn-row" style="margin-top:8px">
        <button id="downloadA">Save processed A</button>
        <button id="downloadB">Save processed B</button>
      </div>
    </section>

    <section class="panel viewer">
      <div class="status" id="status">Load both images to start loop preview.</div>
      <div class="hint">Tip: set View = "Loop A ↔ B" and Render style = "Original" to mimic your supplied pair exactly.</div>
      <canvas id="canvas" width="1280" height="1280"></canvas>
    </section>
  </main>

  <script>
    const refs = {
      fileA: document.getElementById('fileA'),
      fileB: document.getElementById('fileB'),
      viewMode: document.getElementById('viewMode'),
      renderMode: document.getElementById('renderMode'),
      edge: document.getElementById('edge'),
      boost: document.getElementById('boost'),
      blur: document.getElementById('blur'),
      fps: document.getElementById('fps'),
      edgeVal: document.getElementById('edgeVal'),
      boostVal: document.getElementById('boostVal'),
      blurVal: document.getElementById('blurVal'),
      fpsVal: document.getElementById('fpsVal'),
      toggle: document.getElementById('toggle'),
      download: document.getElementById('download'),
      downloadA: document.getElementById('downloadA'),
      downloadB: document.getElementById('downloadB'),
      status: document.getElementById('status'),
      canvas: document.getElementById('canvas')
    };

    const ctx = refs.canvas.getContext('2d', { willReadFrequently: true });
    const sourceA = document.createElement('canvas');
    const sourceB = document.createElement('canvas');
    const sa = sourceA.getContext('2d', { willReadFrequently: true });
    const sb = sourceB.getContext('2d', { willReadFrequently: true });

    let loadedA = false;
    let loadedB = false;
    let playing = true;
    let tick = 0;
    let lastFlip = 0;

    function setLabels() {
      refs.edgeVal.textContent = refs.edge.value;
      refs.boostVal.textContent = Number(refs.boost.value).toFixed(1);
      refs.blurVal.textContent = Number(refs.blur.value).toFixed(1);
      refs.fpsVal.textContent = refs.fps.value;
    }

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function blurGray(gray, w, h, r) {
      if (r <= 0) return gray;
      const radius = Math.floor(r);
      if (radius < 1) return gray;
      const out = new Uint8ClampedArray(gray.length);
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          let sum = 0;
          let count = 0;
          for (let yy = y - radius; yy <= y + radius; yy++) {
            if (yy < 0 || yy >= h) continue;
            for (let xx = x - radius; xx <= x + radius; xx++) {
              if (xx < 0 || xx >= w) continue;
              sum += gray[yy * w + xx];
              count++;
            }
          }
          out[y * w + x] = sum / count;
        }
      }
      return out;
    }

    function processedImageFrom(sourceCanvas, sourceCtx) {
      const w = sourceCanvas.width;
      const h = sourceCanvas.height;
      const renderMode = refs.renderMode.value;
      if (!w || !h) return null;

      if (renderMode === 'source') {
        return sourceCtx.getImageData(0, 0, w, h);
      }

      const src = sourceCtx.getImageData(0, 0, w, h);
      const gray = new Uint8ClampedArray(w * h);
      const d = src.data;
      for (let i = 0, p = 0; i < d.length; i += 4, p++) {
        gray[p] = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
      }

      const blurred = blurGray(gray, w, h, Number(refs.blur.value));
      const out = new ImageData(w, h);
      const od = out.data;
      const threshold = Number(refs.edge.value);
      const boost = Number(refs.boost.value);

      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const i = y * w + x;
          const gx =
            -blurred[i - w - 1] - 2 * blurred[i - 1] - blurred[i + w - 1] +
             blurred[i - w + 1] + 2 * blurred[i + 1] + blurred[i + w + 1];
          const gy =
            -blurred[i - w - 1] - 2 * blurred[i - w] - blurred[i - w + 1] +
             blurred[i + w - 1] + 2 * blurred[i + w] + blurred[i + w + 1];
          const mag = Math.sqrt(gx * gx + gy * gy);
          const line = clamp((mag - threshold) * boost, 0, 255);
          const o = i * 4;

          if (renderMode === 'redOnBlack') {
            od[o] = line; od[o + 1] = 0; od[o + 2] = 0;
          } else {
            const inv = 255 - line;
            od[o] = 255; od[o + 1] = inv; od[o + 2] = inv;
          }
          od[o + 3] = 255;
        }
      }
      return out;
    }

    function drawFit(imgData, dx = 0, dw = refs.canvas.width) {
      const tmp = document.createElement('canvas');
      tmp.width = imgData.width;
      tmp.height = imgData.height;
      tmp.getContext('2d').putImageData(imgData, 0, 0);

      const h = refs.canvas.height;
      const scale = Math.min(dw / imgData.width, h / imgData.height);
      const rw = imgData.width * scale;
      const rh = imgData.height * scale;
      const ox = dx + (dw - rw) / 2;
      const oy = (h - rh) / 2;
      ctx.drawImage(tmp, ox, oy, rw, rh);
    }

    function render() {
      ctx.clearRect(0, 0, refs.canvas.width, refs.canvas.height);
      const mode = refs.viewMode.value;
      const a = loadedA ? processedImageFrom(sourceA, sa) : null;
      const b = loadedB ? processedImageFrom(sourceB, sb) : null;

      if (!a && !b) {
        refs.status.textContent = 'Load at least one image.';
        return;
      }

      if (mode === 'A' || (!b && a)) {
        drawFit(a);
        refs.status.textContent = 'Viewing image A';
        return;
      }

      if (mode === 'B' || (!a && b)) {
        drawFit(b);
        refs.status.textContent = 'Viewing image B';
        return;
      }

      if (mode === 'split') {
        if (a) drawFit(a, 0, refs.canvas.width / 2);
        if (b) drawFit(b, refs.canvas.width / 2, refs.canvas.width / 2);
        refs.status.textContent = 'Split screen A | B';
        return;
      }

      const showA = tick % 2 === 0;
      drawFit(showA ? a : b);
      refs.status.textContent = `Looping ${showA ? 'A' : 'B'} (${refs.fps.value} FPS)`;
    }

    function loadTo(file, canvas, context, label) {
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        context.drawImage(img, 0, 0);
        refs.canvas.width = Math.max(sourceA.width, sourceB.width, img.width);
        refs.canvas.height = Math.max(sourceA.height, sourceB.height, img.height);

        if (label === 'A') loadedA = true;
        if (label === 'B') loadedB = true;

        refs.status.textContent = `Loaded ${label}: ${file.name} (${img.width}×${img.height})`;
        render();
      };
      img.src = URL.createObjectURL(file);
    }

    function loopFrame(ts) {
      const interval = 1000 / Number(refs.fps.value);
      if (playing && ts - lastFlip >= interval) {
        lastFlip = ts;
        tick++;
        if (refs.viewMode.value === 'loop') render();
      }
      requestAnimationFrame(loopFrame);
    }

    refs.fileA.addEventListener('change', (e) => loadTo(e.target.files?.[0], sourceA, sa, 'A'));
    refs.fileB.addEventListener('change', (e) => loadTo(e.target.files?.[0], sourceB, sb, 'B'));

    [refs.viewMode, refs.renderMode, refs.edge, refs.boost, refs.blur, refs.fps].forEach((el) => {
      el.addEventListener('input', () => { setLabels(); render(); });
    });

    refs.toggle.addEventListener('click', () => {
      playing = !playing;
      refs.toggle.textContent = playing ? 'Pause loop' : 'Play loop';
      render();
    });

    refs.download.addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = refs.canvas.toDataURL('image/png');
      a.download = 'escher-loop-preview.png';
      a.click();
    });

    refs.downloadA.addEventListener('click', () => {
      if (!loadedA) return;
      const out = processedImageFrom(sourceA, sa);
      const tmp = document.createElement('canvas');
      tmp.width = out.width; tmp.height = out.height;
      tmp.getContext('2d').putImageData(out, 0, 0);
      const a = document.createElement('a');
      a.href = tmp.toDataURL('image/png');
      a.download = 'escher-processed-A.png';
      a.click();
    });

    refs.downloadB.addEventListener('click', () => {
      if (!loadedB) return;
      const out = processedImageFrom(sourceB, sb);
      const tmp = document.createElement('canvas');
      tmp.width = out.width; tmp.height = out.height;
      tmp.getContext('2d').putImageData(out, 0, 0);
      const a = document.createElement('a');
      a.href = tmp.toDataURL('image/png');
      a.download = 'escher-processed-B.png';
      a.click();
    });

    setLabels();
    requestAnimationFrame(loopFrame);
  </script>
</body>
</html>
