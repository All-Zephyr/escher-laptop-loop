<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Escherify v1 - Fresh Build 2026-03-31</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #10131a;
      color: #eef2ff;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #2d3548;
      background: #161b26;
      position: sticky;
      top: 0;
    }
    .meta {
      font-size: 12px;
      color: #9facbf;
      text-align: right;
      line-height: 1.35;
    }
    .wrap {
      max-width: 1300px;
      margin: 0 auto;
      padding: 14px;
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 12px;
    }
    .panel {
      background: #161b26;
      border: 1px solid #2d3548;
      border-radius: 10px;
      padding: 12px;
    }
    .control { margin-bottom: 10px; }
    .control label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      font-size: 14px;
      color: #d8deef;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    input, button { width: 100%; }
    input[type="range"] { accent-color: #ff4d4d; }
    button {
      border: 1px solid #3f4a62;
      background: #212a3c;
      color: #eef2ff;
      border-radius: 8px;
      padding: 9px;
      font-weight: 700;
      cursor: pointer;
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid #2d3548;
      background: #0f141f;
      display: block;
    }
    .status { color: #9facbf; font-size: 14px; margin-bottom: 8px; min-height: 20px; }
    .hint { color: #9facbf; font-size: 13px; margin-top: 8px; }
    @media (max-width: 980px) { .wrap { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="top">
    <strong>Escherify v1 - Fresh Build</strong>
    <div class="meta" id="meta">Version v1.1<br/>Last edit --</div>
  </header>

  <main class="wrap">
    <section class="panel">
      <p style="margin-top:0;color:#b8c3d8">Upload one image, tweak controls, and export one transformed image.</p>

      <div class="control">
        <label for="file">Image</label>
        <input id="file" type="file" accept="image/*" />
      </div>

      <div class="control row">
        <div>
          <label for="centerX"><span>Center X</span><strong id="centerXVal">600</strong></label>
          <input id="centerX" type="range" min="1" max="1200" value="600" />
        </div>
        <div>
          <label for="centerY"><span>Center Y</span><strong id="centerYVal">600</strong></label>
          <input id="centerY" type="range" min="1" max="1200" value="600" />
        </div>
      </div>

      <div class="control">
        <label for="zoom"><span>Zoom</span><strong id="zoomVal">0.800</strong></label>
        <input id="zoom" type="range" min="0.70" max="1.10" step="0.001" value="0.8" />
      </div>

      <div class="control">
        <label for="branch"><span>Branch direction (°)</span><strong id="branchVal">160.0</strong></label>
        <input id="branch" type="range" min="120" max="220" step="0.1" value="160" />
      </div>

      <div class="control">
        <label for="q"><span>q parameter</span><strong id="qVal">22.584</strong></label>
        <input id="q" type="range" min="2" max="40" step="0.001" value="22.5836845286" />
      </div>

      <div class="control">
        <label for="quality"><span>Preview quality</span><strong id="qualityVal">0.70</strong></label>
        <input id="quality" type="range" min="0.25" max="1" step="0.05" value="0.7" />
      </div>

      <div class="row">
        <button id="reset">Reset</button>
        <button id="download">Download PNG</button>
      </div>

      <p class="hint">Tip: click the preview to place center quickly.</p>
    </section>

    <section class="panel">
      <div class="status" id="status">Upload an image to start.</div>
      <canvas id="canvas" width="900" height="900"></canvas>
    </section>
  </main>

  <script>
    const APP_VERSION = 'v1.1 (fresh-build-2026-03-31)';
    const defaults = { centerX: 600, centerY: 600, zoom: 0.8, branch: 160, q: 22.5836845286, quality: 0.7 };

    const el = {
      file: document.getElementById('file'),
      centerX: document.getElementById('centerX'),
      centerY: document.getElementById('centerY'),
      zoom: document.getElementById('zoom'),
      branch: document.getElementById('branch'),
      q: document.getElementById('q'),
      quality: document.getElementById('quality'),
      centerXVal: document.getElementById('centerXVal'),
      centerYVal: document.getElementById('centerYVal'),
      zoomVal: document.getElementById('zoomVal'),
      branchVal: document.getElementById('branchVal'),
      qVal: document.getElementById('qVal'),
      qualityVal: document.getElementById('qualityVal'),
      reset: document.getElementById('reset'),
      download: document.getElementById('download'),
      status: document.getElementById('status'),
      canvas: document.getElementById('canvas'),
      meta: document.getElementById('meta')
    };

    const srcCanvas = document.createElement('canvas');
    const srcCtx = srcCanvas.getContext('2d', { willReadFrequently: true });
    const ctx = el.canvas.getContext('2d', { willReadFrequently: true });
    let loaded = false;
    let renderToken = 0;

    function setLabels() {
      el.centerXVal.textContent = Math.round(el.centerX.value);
      el.centerYVal.textContent = Math.round(el.centerY.value);
      el.zoomVal.textContent = Number(el.zoom.value).toFixed(3);
      el.branchVal.textContent = Number(el.branch.value).toFixed(1);
      el.qVal.textContent = Number(el.q.value).toFixed(3);
      el.qualityVal.textContent = Number(el.quality.value).toFixed(2);
    }

    function toComplex(x, y, n) {
      return { re: -1 + (2 * (x - 1)) / (n - 1), im: 1 - (2 * (y - 1)) / (n - 1) };
    }

    function sampleBilinear(src, width, height, x, y) {
      if (x < 1 || x > width || y < 1 || y > height) return [255, 255, 255];
      const fx = x - 1, fy = y - 1;
      const x0 = Math.floor(fx), y0 = Math.floor(fy);
      const x1 = Math.min(x0 + 1, width - 1), y1 = Math.min(y0 + 1, height - 1);
      const dx = fx - x0, dy = fy - y0;
      const i00 = (y0 * width + x0) * 4, i10 = (y0 * width + x1) * 4, i01 = (y1 * width + x0) * 4, i11 = (y1 * width + x1) * 4;
      const rgb = [0, 0, 0];
      for (let k = 0; k < 3; k++) {
        const a = src[i00 + k] * (1 - dx) + src[i10 + k] * dx;
        const b = src[i01 + k] * (1 - dx) + src[i11 + k] * dx;
        rgb[k] = a * (1 - dy) + b * dy;
      }
      return rgb;
    }

    function render(forceFull = false) {
      if (!loaded) return;
      const n = srcCanvas.width;
      const outN = Math.max(220, Math.floor(n * (forceFull ? 1 : Number(el.quality.value))));
      el.canvas.width = outN;
      el.canvas.height = outN;

      const src = srcCtx.getImageData(0, 0, n, n).data;
      const out = ctx.createImageData(outN, outN);
      const dst = out.data;

      const q = Number(el.q.value);
      const alphaRe = 1;
      const alphaIm = -Math.log(q) / (2 * Math.PI);
      const alphaDen = alphaRe * alphaRe + alphaIm * alphaIm;
      const theta = Number(el.branch.value) * Math.PI / 180;
      const rotRe = Math.cos(theta), rotIm = Math.sin(theta);
      const invRe = rotRe, invIm = -rotIm;
      const zoom = Number(el.zoom.value);
      const centerX = Number(el.centerX.value), centerY = Number(el.centerY.value);
      const zCenter = toComplex(centerX, centerY, n);
      const scale = (n - 1) / Math.max(1, outN - 1);
      const pixScale = (n - 1) / 2;
      const eps = 1e-12;
      const t0 = performance.now();

      for (let oy = 0; oy < outN; oy++) {
        const py = 1 + oy * scale;
        const wIm = 1 - (2 * (py - 1)) / (n - 1);
        for (let ox = 0; ox < outN; ox++) {
          const px = 1 + ox * scale;
          const wRe = -1 + (2 * (px - 1)) / (n - 1);
          const uRe = wRe - zCenter.re;
          const uIm = wIm - zCenter.im;
          let srcX = centerX, srcY = centerY;

          if (Math.hypot(uRe, uIm) >= eps) {
            const u2Re = uRe * invRe - uIm * invIm;
            const u2Im = uRe * invIm + uIm * invRe;
            const logRe = Math.log(Math.hypot(u2Re, u2Im));
            const logIm = Math.atan2(u2Im, u2Re);
            const divRe = (logRe * alphaRe + logIm * alphaIm) / alphaDen;
            const divIm = (logIm * alphaRe - logRe * alphaIm) / alphaDen;
            const expMag = Math.exp(divRe);
            const expRe = expMag * Math.cos(divIm);
            const expIm = expMag * Math.sin(divIm);
            const mapRe = rotRe * expRe - rotIm * expIm;
            const mapIm = rotRe * expIm + rotIm * expRe;
            const zRe = zCenter.re + zoom * mapRe;
            const zIm = zCenter.im + zoom * mapIm;
            srcX = 1 + (zRe + 1) * pixScale;
            srcY = 1 + (1 - zIm) * pixScale;
          }

          const rgb = sampleBilinear(src, n, n, srcX, srcY);
          const di = (oy * outN + ox) * 4;
          dst[di] = rgb[0]; dst[di + 1] = rgb[1]; dst[di + 2] = rgb[2]; dst[di + 3] = 255;
        }
      }

      ctx.putImageData(out, 0, 0);
      el.status.textContent = `Rendered ${outN}×${outN} in ~${Math.round(performance.now() - t0)}ms`;
    }

    function requestRender() {
      if (!loaded) return;
      const token = ++renderToken;
      requestAnimationFrame(() => {
        if (token === renderToken) render(false);
      });
    }

    function loadImage(file) {
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        const n = Math.min(img.width, img.height, 1600);
        srcCanvas.width = n; srcCanvas.height = n;
        srcCtx.clearRect(0, 0, n, n);
        srcCtx.drawImage(img, 0, 0, n, n);
        el.centerX.max = n; el.centerY.max = n;
        el.centerX.value = Math.round(Math.min(defaults.centerX, n));
        el.centerY.value = Math.round(Math.min(defaults.centerY, n));
        loaded = true;
        setLabels();
        requestRender();
      };
      img.src = URL.createObjectURL(file);
    }

    el.file.addEventListener('change', (e) => loadImage(e.target.files?.[0]));
    [el.centerX, el.centerY, el.zoom, el.branch, el.q, el.quality].forEach((node) => {
      node.addEventListener('input', () => { setLabels(); requestRender(); });
    });

    el.canvas.addEventListener('click', (e) => {
      if (!loaded) return;
      const rect = el.canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      const n = srcCanvas.width;
      el.centerX.value = Math.max(1, Math.min(n, Math.round(1 + x * (n - 1))));
      el.centerY.value = Math.max(1, Math.min(n, Math.round(1 + y * (n - 1))));
      setLabels();
      requestRender();
    });

    el.reset.addEventListener('click', () => {
      el.zoom.value = defaults.zoom;
      el.branch.value = defaults.branch;
      el.q.value = defaults.q;
      el.quality.value = defaults.quality;
      if (loaded) {
        const n = srcCanvas.width;
        el.centerX.value = Math.round(Math.min(defaults.centerX, n));
        el.centerY.value = Math.round(Math.min(defaults.centerY, n));
      }
      setLabels();
      requestRender();
    });

    el.download.addEventListener('click', () => {
      if (!loaded) return;
      render(true);
      const a = document.createElement('a');
      a.href = el.canvas.toDataURL('image/png');
      a.download = 'escherify-v1.png';
      a.click();
      requestRender();
    });

    const lastEdit = new Date(document.lastModified);
    el.meta.innerHTML = `Version ${APP_VERSION}<br/>Last edit ${Number.isNaN(lastEdit.getTime()) ? 'Unknown' : lastEdit.toLocaleString()}`;
    setLabels();
  </script>
</body>
</html>
