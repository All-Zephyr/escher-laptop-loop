<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Escherify v1</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #151a24;
      --text: #ecf0f7;
      --muted: #9da8c0;
      --accent: #ff4d4d;
      --border: #2c3448;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #1a2230, var(--bg) 48%);
      color: var(--text);
      min-height: 100vh;
    }
    .meta {
      position: fixed;
      top: 10px;
      right: 12px;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(12, 15, 24, 0.9);
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
      text-align: right;
      z-index: 100;
    }
    .app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 14px;
    }
    .panel {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: color-mix(in oklab, var(--panel), #000 8%);
      padding: 14px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.25rem;
    }
    .sub {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.4;
      font-size: .92rem;
    }
    .control { margin: 0 0 11px; }
    .control label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: .9rem;
    }
    input, button { width: 100%; }
    input[type="range"] { accent-color: var(--accent); }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    button {
      border: 1px solid #4b5670;
      background: #20283a;
      color: var(--text);
      border-radius: 9px;
      padding: 10px;
      font-weight: 650;
      cursor: pointer;
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0f141d;
    }
    .status {
      color: var(--muted);
      font-size: .9rem;
      margin-bottom: 8px;
      min-height: 1.2rem;
    }
    @media (max-width: 1024px) {
      .app { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <aside id="meta" class="meta">Escherify v1<br/>Last edit --</aside>

  <main class="app">
    <section class="panel">
      <h1>Escherify v1</h1>
      <p class="sub">Upload a single image, adjust parameters live, and export an Escher-style transformed image.</p>

      <div class="control">
        <label for="file">Image upload</label>
        <input id="file" type="file" accept="image/*" />
      </div>

      <div class="control row">
        <div>
          <label for="centerX"><span>Center X</span><strong id="centerXVal">600</strong></label>
          <input id="centerX" type="range" min="1" max="1200" value="600" />
        </div>
        <div>
          <label for="centerY"><span>Center Y</span><strong id="centerYVal">600</strong></label>
          <input id="centerY" type="range" min="1" max="1200" value="600" />
        </div>
      </div>

      <div class="control">
        <label for="zoom"><span>Zoom</span><strong id="zoomVal">0.800</strong></label>
        <input id="zoom" type="range" min="0.70" max="1.10" step="0.001" value="0.80" />
      </div>

      <div class="control">
        <label for="branch"><span>Branch direction (°)</span><strong id="branchVal">160.0</strong></label>
        <input id="branch" type="range" min="120" max="220" step="0.1" value="160" />
      </div>

      <div class="control">
        <label for="q"><span>q parameter</span><strong id="qVal">22.584</strong></label>
        <input id="q" type="range" min="2" max="40" step="0.001" value="22.5836845286" />
      </div>

      <div class="control">
        <label for="quality"><span>Preview quality</span><strong id="qualityVal">0.70</strong></label>
        <input id="quality" type="range" min="0.25" max="1" step="0.05" value="0.70" />
      </div>

      <div class="row">
        <button id="reset">Reset defaults</button>
        <button id="download">Download PNG</button>
      </div>
      <p class="sub" style="margin-top:10px">Tip: click on the preview to set center quickly.</p>
    </section>

    <section class="panel">
      <div id="status" class="status">Upload an image to begin.</div>
      <canvas id="canvas" width="900" height="900"></canvas>
    </section>
  </main>

  <script>
    const APP_VERSION = 'Escherify v1';

    const el = {
      file: document.getElementById('file'),
      centerX: document.getElementById('centerX'),
      centerY: document.getElementById('centerY'),
      zoom: document.getElementById('zoom'),
      branch: document.getElementById('branch'),
      q: document.getElementById('q'),
      quality: document.getElementById('quality'),
      centerXVal: document.getElementById('centerXVal'),
      centerYVal: document.getElementById('centerYVal'),
      zoomVal: document.getElementById('zoomVal'),
      branchVal: document.getElementById('branchVal'),
      qVal: document.getElementById('qVal'),
      qualityVal: document.getElementById('qualityVal'),
      reset: document.getElementById('reset'),
      download: document.getElementById('download'),
      status: document.getElementById('status'),
      canvas: document.getElementById('canvas'),
      meta: document.getElementById('meta')
    };

    const defaults = {
      centerX: 600,
      centerY: 600,
      zoom: 0.8,
      branch: 160,
      q: 22.5836845286,
      quality: 0.7
    };

    const srcCanvas = document.createElement('canvas');
    const srcCtx = srcCanvas.getContext('2d', { willReadFrequently: true });
    const ctx = el.canvas.getContext('2d', { willReadFrequently: true });

    let loaded = false;
    let renderToken = 0;

    function setLabels() {
      el.centerXVal.textContent = Math.round(el.centerX.value);
      el.centerYVal.textContent = Math.round(el.centerY.value);
      el.zoomVal.textContent = Number(el.zoom.value).toFixed(3);
      el.branchVal.textContent = Number(el.branch.value).toFixed(1);
      el.qVal.textContent = Number(el.q.value).toFixed(3);
      el.qualityVal.textContent = Number(el.quality.value).toFixed(2);
    }

    function toComplex(x, y, n) {
      return {
        re: -1 + (2 * (x - 1)) / (n - 1),
        im: 1 - (2 * (y - 1)) / (n - 1)
      };
    }

    function sampleBilinear(src, width, height, x, y) {
      if (x < 1 || x > width || y < 1 || y > height) return [255, 255, 255, 255];
      const fx = x - 1;
      const fy = y - 1;
      const x0 = Math.floor(fx), y0 = Math.floor(fy);
      const x1 = Math.min(x0 + 1, width - 1), y1 = Math.min(y0 + 1, height - 1);
      const dx = fx - x0, dy = fy - y0;

      const i00 = (y0 * width + x0) * 4;
      const i10 = (y0 * width + x1) * 4;
      const i01 = (y1 * width + x0) * 4;
      const i11 = (y1 * width + x1) * 4;

      const out = [0, 0, 0, 255];
      for (let k = 0; k < 3; k++) {
        const a = src[i00 + k] * (1 - dx) + src[i10 + k] * dx;
        const b = src[i01 + k] * (1 - dx) + src[i11 + k] * dx;
        out[k] = a * (1 - dy) + b * dy;
      }
      return out;
    }

    function requestRender() {
      if (!loaded) return;
      const token = ++renderToken;
      requestAnimationFrame(() => {
        if (token !== renderToken) return;
        render();
      });
    }

    function render(forceFull = false) {
      if (!loaded) return;

      const n = srcCanvas.width;
      const quality = forceFull ? 1 : Number(el.quality.value);
      const outN = Math.max(200, Math.floor(n * quality));
      el.canvas.width = outN;
      el.canvas.height = outN;

      const src = srcCtx.getImageData(0, 0, n, n).data;
      const out = ctx.createImageData(outN, outN);
      const dst = out.data;

      const q = Number(el.q.value);
      const alphaRe = 1;
      const alphaIm = -Math.log(q) / (2 * Math.PI);
      const alphaDen = alphaRe * alphaRe + alphaIm * alphaIm;

      const theta = (Number(el.branch.value) * Math.PI) / 180;
      const rotRe = Math.cos(theta);
      const rotIm = Math.sin(theta);
      const invRe = rotRe;
      const invIm = -rotIm;

      const zoom = Number(el.zoom.value);
      const centerX = Number(el.centerX.value);
      const centerY = Number(el.centerY.value);
      const zCenter = toComplex(centerX, centerY, n);

      const xScale = (n - 1) / Math.max(1, outN - 1);
      const yScale = (n - 1) / Math.max(1, outN - 1);
      const pixScale = (n - 1) / 2;
      const eps = 1e-12;

      const t0 = performance.now();

      for (let oy = 0; oy < outN; oy++) {
        const py = 1 + oy * yScale;
        const wIm = 1 - (2 * (py - 1)) / (n - 1);

        for (let ox = 0; ox < outN; ox++) {
          const px = 1 + ox * xScale;
          const wRe = -1 + (2 * (px - 1)) / (n - 1);

          const uRe = wRe - zCenter.re;
          const uIm = wIm - zCenter.im;

          let srcX = centerX;
          let srcY = centerY;

          if (Math.hypot(uRe, uIm) >= eps) {
            const u2Re = uRe * invRe - uIm * invIm;
            const u2Im = uRe * invIm + uIm * invRe;

            const logRe = Math.log(Math.hypot(u2Re, u2Im));
            const logIm = Math.atan2(u2Im, u2Re);

            const divRe = (logRe * alphaRe + logIm * alphaIm) / alphaDen;
            const divIm = (logIm * alphaRe - logRe * alphaIm) / alphaDen;

            const expMul = Math.exp(divRe);
            const expRe = expMul * Math.cos(divIm);
            const expIm = expMul * Math.sin(divIm);

            const mappedRe = rotRe * expRe - rotIm * expIm;
            const mappedIm = rotRe * expIm + rotIm * expRe;

            const zRe = zCenter.re + zoom * mappedRe;
            const zIm = zCenter.im + zoom * mappedIm;

            srcX = 1 + (zRe + 1) * pixScale;
            srcY = 1 + (1 - zIm) * pixScale;
          }

          const rgba = sampleBilinear(src, n, n, srcX, srcY);
          const di = (oy * outN + ox) * 4;
          dst[di] = rgba[0];
          dst[di + 1] = rgba[1];
          dst[di + 2] = rgba[2];
          dst[di + 3] = 255;
        }
      }

      ctx.putImageData(out, 0, 0);
      const ms = Math.round(performance.now() - t0);
      el.status.textContent = `Rendered ${outN}×${outN} in ~${ms}ms.`;
    }

    function loadImage(file) {
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        const n = Math.min(img.width, img.height, 1600);
        srcCanvas.width = n;
        srcCanvas.height = n;
        srcCtx.clearRect(0, 0, n, n);
        srcCtx.drawImage(img, 0, 0, n, n);

        el.centerX.max = n;
        el.centerY.max = n;
        el.centerX.value = Math.round(Math.min(defaults.centerX, n));
        el.centerY.value = Math.round(Math.min(defaults.centerY, n));

        loaded = true;
        setLabels();
        requestRender();
      };
      img.src = URL.createObjectURL(file);
    }

    el.file.addEventListener('change', (e) => loadImage(e.target.files?.[0]));

    [el.centerX, el.centerY, el.zoom, el.branch, el.q, el.quality].forEach((control) => {
      control.addEventListener('input', () => {
        setLabels();
        requestRender();
      });
    });

    el.canvas.addEventListener('click', (e) => {
      if (!loaded) return;
      const rect = el.canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      const n = srcCanvas.width;
      el.centerX.value = Math.max(1, Math.min(n, Math.round(1 + x * (n - 1))));
      el.centerY.value = Math.max(1, Math.min(n, Math.round(1 + y * (n - 1))));
      setLabels();
      requestRender();
    });

    el.reset.addEventListener('click', () => {
      el.zoom.value = defaults.zoom;
      el.branch.value = defaults.branch;
      el.q.value = defaults.q;
      el.quality.value = defaults.quality;
      if (loaded) {
        const n = srcCanvas.width;
        el.centerX.value = Math.round(Math.min(defaults.centerX, n));
        el.centerY.value = Math.round(Math.min(defaults.centerY, n));
      }
      setLabels();
      requestRender();
    });

    el.download.addEventListener('click', () => {
      if (!loaded) return;
      render(true);
      const a = document.createElement('a');
      a.href = el.canvas.toDataURL('image/png');
      a.download = 'escherify-v1.png';
      a.click();
      requestRender();
    });

    const lastEdit = new Date(document.lastModified);
    const lastEditText = Number.isNaN(lastEdit.getTime()) ? 'Unknown' : lastEdit.toLocaleString();
    el.meta.innerHTML = `${APP_VERSION}<br/>Last edit ${lastEditText}`;
    setLabels();
  </script>
</body>
</html>
