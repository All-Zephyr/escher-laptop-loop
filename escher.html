<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Escher Recursion Playground</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d0f14;
      --panel: #161a24;
      --text: #eef1f7;
      --muted: #9ea7bc;
      --accent: #ff4d4d;
      --border: #2f3648;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1b2230, var(--bg) 46%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap {
      max-width: 1360px;
      margin: 0 auto;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 370px 1fr;
      gap: 14px;
      padding: 18px;
    }
    .panel {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: color-mix(in oklab, var(--panel), #000 10%);
      padding: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,.3);
    }
    h1 { margin: 0 0 8px; font-size: 1.2rem; }
    .small { color: var(--muted); margin: 0 0 12px; font-size: .9rem; line-height: 1.35; }
    .control { margin-bottom: 11px; }
    .control label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: .9rem;
    }
    input, button, select { width: 100%; }
    input[type="range"] { accent-color: var(--accent); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button {
      border: 1px solid #4a556d;
      background: #212838;
      color: var(--text);
      border-radius: 9px;
      padding: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    canvas {
      width: 100%;
      height: auto;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #10131a;
      image-rendering: auto;
    }
    .status { color: var(--muted); font-size: .9rem; margin-bottom: 8px; }
    .tip { color: var(--muted); font-size: .84rem; margin-top: 8px; }
    @media (max-width: 1040px) { .wrap { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="panel">
      <h1>Escher Recursion Playground</h1>
      <p class="small">This is your Mathematica setup turned into live website controls. Upload an image, drag/tweak values, and preview instantly.</p>

      <div class="control">
        <label for="file">Image</label>
        <input id="file" type="file" accept="image/*" />
      </div>

      <div class="control row">
        <div>
          <label for="centerX"><span>Center X</span><strong id="centerXVal">567</strong></label>
          <input id="centerX" type="range" min="1" max="1200" value="567" />
        </div>
        <div>
          <label for="centerY"><span>Center Y</span><strong id="centerYVal">289</strong></label>
          <input id="centerY" type="range" min="1" max="1200" value="289" />
        </div>
      </div>

      <div class="control">
        <label for="zoom"><span>Zoom</span><strong id="zoomVal">0.80</strong></label>
        <input id="zoom" type="range" min="0.70" max="1.10" step="0.001" value="0.80" />
      </div>

      <div class="control">
        <label for="branch"><span>Branch direction (°)</span><strong id="branchVal">160</strong></label>
        <input id="branch" type="range" min="120" max="220" step="0.1" value="160" />
      </div>

      <div class="control">
        <label for="q"><span>q parameter</span><strong id="qVal">22.584</strong></label>
        <input id="q" type="range" min="2" max="40" step="0.001" value="22.5836845286" />
      </div>

      <div class="control">
        <label for="quality"><span>Preview quality</span><strong id="qualityVal">0.70</strong></label>
        <input id="quality" type="range" min="0.30" max="1" step="0.05" value="0.70" />
      </div>

      <div class="row">
        <button id="reset">Reset defaults</button>
        <button id="download">Download PNG</button>
      </div>
      <p class="tip">Tip: click on the preview to place Center X/Y directly.</p>
    </section>

    <section class="panel">
      <div class="status" id="status">Load an image to start. Then adjust sliders and see live output.</div>
      <canvas id="canvas" width="900" height="900"></canvas>
    </section>
  </main>

  <script>
    const el = {
      file: document.getElementById('file'),
      centerX: document.getElementById('centerX'),
      centerY: document.getElementById('centerY'),
      zoom: document.getElementById('zoom'),
      branch: document.getElementById('branch'),
      q: document.getElementById('q'),
      quality: document.getElementById('quality'),
      centerXVal: document.getElementById('centerXVal'),
      centerYVal: document.getElementById('centerYVal'),
      zoomVal: document.getElementById('zoomVal'),
      branchVal: document.getElementById('branchVal'),
      qVal: document.getElementById('qVal'),
      qualityVal: document.getElementById('qualityVal'),
      reset: document.getElementById('reset'),
      download: document.getElementById('download'),
      status: document.getElementById('status'),
      canvas: document.getElementById('canvas')
    };

    const ctx = el.canvas.getContext('2d', { willReadFrequently: true });
    const srcCanvas = document.createElement('canvas');
    const srcCtx = srcCanvas.getContext('2d', { willReadFrequently: true });

    let loaded = false;
    let renderToken = 0;

    const defaults = {
      centerX: 567,
      centerY: 289,
      zoom: 0.8,
      branch: 160,
      q: 22.5836845286,
      quality: 0.7
    };

    function setLabels() {
      el.centerXVal.textContent = Math.round(el.centerX.value);
      el.centerYVal.textContent = Math.round(el.centerY.value);
      el.zoomVal.textContent = Number(el.zoom.value).toFixed(3);
      el.branchVal.textContent = Number(el.branch.value).toFixed(1);
      el.qVal.textContent = Number(el.q.value).toFixed(3);
      el.qualityVal.textContent = Number(el.quality.value).toFixed(2);
    }

    const c = {
      add: (a, b) => ({ re: a.re + b.re, im: a.im + b.im }),
      sub: (a, b) => ({ re: a.re - b.re, im: a.im - b.im }),
      mul: (a, b) => ({ re: a.re * b.re - a.im * b.im, im: a.re * b.im + a.im * b.re }),
      div: (a, b) => {
        const d = b.re * b.re + b.im * b.im;
        return { re: (a.re * b.re + a.im * b.im) / d, im: (a.im * b.re - a.re * b.im) / d };
      },
      abs: (a) => Math.hypot(a.re, a.im),
      exp: (a) => {
        const e = Math.exp(a.re);
        return { re: e * Math.cos(a.im), im: e * Math.sin(a.im) };
      },
      log: (a) => ({ re: Math.log(Math.hypot(a.re, a.im)), im: Math.atan2(a.im, a.re) })
    };

    function toComplex(x, y, n) {
      return {
        re: -1 + 2 * (x - 1) / (n - 1),
        im: 1 - 2 * (y - 1) / (n - 1)
      };
    }

    function toPixel(z, n) {
      return {
        x: 1 + (z.re + 1) * (n - 1) / 2,
        y: 1 + (1 - z.im) * (n - 1) / 2
      };
    }

    function sampleBilinear(src, width, height, x, y) {
      if (x < 1 || x > width || y < 1 || y > height) return [255, 255, 255, 255];
      const fx = x - 1;
      const fy = y - 1;
      const x0 = Math.floor(fx), y0 = Math.floor(fy);
      const x1 = Math.min(x0 + 1, width - 1), y1 = Math.min(y0 + 1, height - 1);
      const dx = fx - x0, dy = fy - y0;

      function px(ix, iy) {
        const i = (iy * width + ix) * 4;
        return [src[i], src[i + 1], src[i + 2], src[i + 3]];
      }

      const p00 = px(x0, y0), p10 = px(x1, y0), p01 = px(x0, y1), p11 = px(x1, y1);
      const out = [0, 0, 0, 255];
      for (let k = 0; k < 3; k++) {
        const a = p00[k] * (1 - dx) + p10[k] * dx;
        const b = p01[k] * (1 - dx) + p11[k] * dx;
        out[k] = a * (1 - dy) + b * dy;
      }
      return out;
    }

    function requestRender() {
      if (!loaded) return;
      const token = ++renderToken;
      setTimeout(() => {
        if (token !== renderToken) return;
        render();
      }, 0);
    }

    function render() {
      if (!loaded) return;

      const n = srcCanvas.width;
      const quality = Number(el.quality.value);
      const outN = Math.max(200, Math.floor(n * quality));
      el.canvas.width = outN;
      el.canvas.height = outN;

      const src = srcCtx.getImageData(0, 0, n, n).data;
      const out = ctx.createImageData(outN, outN);
      const dst = out.data;

      const q = Number(el.q.value);
      const alpha = { re: 1, im: -Math.log(q) / (2 * Math.PI) };
      const zoom = Number(el.zoom.value);
      const theta = Number(el.branch.value) * Math.PI / 180;
      const rot = { re: Math.cos(theta), im: Math.sin(theta) };
      const rotInv = { re: Math.cos(-theta), im: Math.sin(-theta) };
      const zCenter = toComplex(Number(el.centerX.value), Number(el.centerY.value), n);
      const eps = 1e-12;

      const t0 = performance.now();

      for (let oy = 1; oy <= outN; oy++) {
        for (let ox = 1; ox <= outN; ox++) {
          const w = toComplex(1 + (ox - 1) * (n - 1) / (outN - 1), 1 + (oy - 1) * (n - 1) / (outN - 1), n);
          const u = c.sub(w, zCenter);

          let srcPx;
          if (c.abs(u) < eps) {
            srcPx = { x: Number(el.centerX.value), y: Number(el.centerY.value) };
          } else {
            const u2 = c.mul(u, rotInv);
            const mapped = c.mul(rot, c.exp(c.div(c.log(u2), alpha)));
            const z = c.add(zCenter, { re: zoom * mapped.re, im: zoom * mapped.im });
            srcPx = toPixel(z, n);
          }

          const rgba = sampleBilinear(src, n, n, srcPx.x, srcPx.y);
          const di = ((oy - 1) * outN + (ox - 1)) * 4;
          dst[di] = rgba[0];
          dst[di + 1] = rgba[1];
          dst[di + 2] = rgba[2];
          dst[di + 3] = 255;
        }
      }

      ctx.putImageData(out, 0, 0);
      const ms = Math.round(performance.now() - t0);
      el.status.textContent = `Rendered ${outN}×${outN} in ~${ms}ms. Click image to move center.`;
    }

    function loadImage(file) {
      if (!file) return;
      const img = new Image();
      img.onload = () => {
        const n = Math.min(img.width, img.height, 1600);
        srcCanvas.width = n;
        srcCanvas.height = n;
        srcCtx.clearRect(0, 0, n, n);
        srcCtx.drawImage(img, 0, 0, n, n);

        el.centerX.max = n; el.centerY.max = n;
        el.centerX.value = Math.round(Math.min(defaults.centerX, n));
        el.centerY.value = Math.round(Math.min(defaults.centerY, n));

        loaded = true;
        setLabels();
        requestRender();
      };
      img.src = URL.createObjectURL(file);
    }

    el.canvas.addEventListener('click', (e) => {
      if (!loaded) return;
      const rect = el.canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      const n = srcCanvas.width;
      el.centerX.value = Math.max(1, Math.min(n, Math.round(1 + x * (n - 1))));
      el.centerY.value = Math.max(1, Math.min(n, Math.round(1 + y * (n - 1))));
      setLabels();
      requestRender();
    });

    el.file.addEventListener('change', (e) => loadImage(e.target.files?.[0]));

    [el.centerX, el.centerY, el.zoom, el.branch, el.q, el.quality].forEach((control) => {
      control.addEventListener('input', () => {
        setLabels();
        requestRender();
      });
    });

    el.reset.addEventListener('click', () => {
      el.zoom.value = defaults.zoom;
      el.branch.value = defaults.branch;
      el.q.value = defaults.q;
      el.quality.value = defaults.quality;
      if (loaded) {
        const n = srcCanvas.width;
        el.centerX.value = Math.round(Math.min(defaults.centerX, n));
        el.centerY.value = Math.round(Math.min(defaults.centerY, n));
      }
      setLabels();
      requestRender();
    });

    el.download.addEventListener('click', () => {
      if (!loaded) return;
      const old = el.quality.value;
      el.quality.value = 1;
      setLabels();
      render();
      const a = document.createElement('a');
      a.href = el.canvas.toDataURL('image/png');
      a.download = 'escherified.png';
      a.click();
      el.quality.value = old;
      setLabels();
      requestRender();
    });

    setLabels();
  </script>
</body>
</html>
